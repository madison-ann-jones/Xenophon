<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background: #121212; color: #ffffff; }
    h2 { font-size: 18px; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; color: #00d2ff; }
    .status-card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .asset-name { font-size: 24px; font-weight: bold; margin-bottom: 5px; }
    .advice { font-size: 20px; font-weight: bold; padding: 8px; border-radius: 4px; text-align: center; margin-top: 10px; }
    .buy { background: rgba(0, 200, 83, 0.2); color: #00c853; border: 1px solid #00c853; }
    .sell { background: rgba(213, 0, 0, 0.2); color: #d50000; border: 1px solid #d50000; }
    .hold { background: rgba(255, 171, 0, 0.2); color: #ffab00; border: 1px solid #ffab00; }
    .metrics { font-size: 13px; color: #aaa; margin-top: 10px; line-height: 1.5; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    #loading { display: none; text-align: center; font-style: italic; color: #888; }
  </style>
</head>
<body>
  <h2>TradeAdvisor Pro v2.0</h2>
  
  <div class="status-card">
    <div class="asset-name" id="asset-ticker">Waiting...</div>
    <div id="asset-type" style="font-size: 12px; color: #888;">Navigate to a supported exchange</div>
    
    <div id="loading">Analyzing market data...</div>
    
    <div id="advice-container" style="display:none;">
      <div id="decision" class="advice hold">HOLD</div>
      <div class="metrics" id="metrics-data">
        <!-- Technical metrics will populate here -->
      </div>
    </div>
  </div>

  <button id="analyze-btn">Force Analysis</button>

  <script src="popup.js"></script>
</body>
</html>
